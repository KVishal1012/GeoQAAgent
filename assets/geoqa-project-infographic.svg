<svg width="1400" height="560" viewBox="0 0 1400 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GeoQA Agent flowchart infographic</title>
  <desc id="desc">Minimal graphical flowchart showing the GeoQA Agent pipeline from input files through ingestion, normalization, checks, scoring, and outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6FBFF"/>
      <stop offset="1" stop-color="#EEF7F1"/>
    </linearGradient>
    <linearGradient id="hero" x1="80" y1="56" x2="1320" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B3954"/>
      <stop offset="1" stop-color="#087E8B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0B3954" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11V1Z" fill="#2A4D69"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #D7EEF1; }
      .step { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #087E8B; letter-spacing: 0.08em; text-transform: uppercase; }
      .card-title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #0B3954; }
      .body { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #17324D; }
      .small { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #456074; }
      .mono { font: 600 15px 'Courier New', monospace; fill: #0B3954; }
    </style>
  </defs>

  <rect width="1400" height="560" rx="28" fill="url(#bg)"/>

  <rect x="80" y="40" width="1240" height="96" rx="24" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="118" y="82" class="title">GeoQA Agent</text>
  <text x="118" y="112" class="subtitle">Minimal project flowchart: validate geospatial data, run deterministic QA, and produce actionable readiness outputs.</text>

  <rect x="80" y="210" width="210" height="180" rx="24" fill="#FFFFFF" stroke="#D2E3EC" filter="url(#shadow)"/>
  <text x="108" y="248" class="step">Input</text>
  <text x="108" y="286" class="card-title">Files</text>
  <text x="108" y="324" class="body">GeoJSON</text>
  <text x="108" y="352" class="body">GPKG</text>
  <text x="108" y="380" class="body">Zipped shapefile</text>

  <rect x="338" y="210" width="220" height="180" rx="24" fill="#FFFFFF" stroke="#D2E3EC" filter="url(#shadow)"/>
  <text x="366" y="248" class="step">Stage 1</text>
  <text x="366" y="286" class="card-title">Ingestion</text>
  <text x="366" y="320" class="body">Validate file</text>
  <text x="366" y="348" class="body">Load with GeoPandas</text>
  <text x="366" y="376" class="small">Creates a GeoDataFrame and metadata</text>

  <rect x="606" y="210" width="220" height="180" rx="24" fill="#FFFFFF" stroke="#D2E3EC" filter="url(#shadow)"/>
  <text x="634" y="248" class="step">Stage 2</text>
  <text x="634" y="286" class="card-title">Normalization</text>
  <text x="634" y="320" class="body">CRS handling</text>
  <text x="634" y="348" class="body">Geometry repair</text>
  <text x="634" y="376" class="body">Optional precision grid</text>

  <rect x="874" y="210" width="220" height="180" rx="24" fill="#FFFFFF" stroke="#D2E3EC" filter="url(#shadow)"/>
  <text x="902" y="248" class="step">Stage 3</text>
  <text x="902" y="286" class="card-title">QA Checks</text>
  <text x="902" y="320" class="body">CRS</text>
  <text x="902" y="348" class="body">Geometry</text>
  <text x="902" y="376" class="body">Schema + optional downstream checks</text>

  <rect x="1142" y="210" width="178" height="180" rx="24" fill="#FFFFFF" stroke="#D2E3EC" filter="url(#shadow)"/>
  <text x="1170" y="248" class="step">Stage 4</text>
  <text x="1170" y="286" class="card-title">Outputs</text>
  <text x="1170" y="320" class="body">Severity</text>
  <text x="1170" y="348" class="body">Readiness score</text>
  <text x="1170" y="376" class="body">Report + CSV + JSON</text>

  <line x1="290" y1="300" x2="338" y2="300" stroke="#2A4D69" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="558" y1="300" x2="606" y2="300" stroke="#2A4D69" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="826" y1="300" x2="874" y2="300" stroke="#2A4D69" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1094" y1="300" x2="1142" y2="300" stroke="#2A4D69" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="80" y="470" class="mono">app.py -> geoqa.runner -> ingestion -> normalization -> checks -> severity/scoring -> reporting</text>
</svg>
